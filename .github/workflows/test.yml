name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type check
        run: mypy ductor_bot/

      - name: Tests
        run: pytest tests/ -q

      - name: Translation keys
        run: python -m ductor_bot.i18n.check

      - name: Agent docs bundle
        run: python scripts/build_agent_docs.py --check

  scripts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Script tests
        run: python -m unittest discover -s scripts/tests

      - name: Shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

  lint:
    # Informational: a ruff finding does not fail the workflow.
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.9"

      - name: Lint
        run: ruff check ductor_bot/

      - name: Format
        run: ruff format --check ductor_bot/

  browser-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker/browser/control-server

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test
