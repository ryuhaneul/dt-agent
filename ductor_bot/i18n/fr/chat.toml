prompt_know = """\
Salut, je viens d'installer DT Agent et j'aimerais qu'on apprenne à se connaître. \
Pose-moi toutes les questions nécessaires pour qu'on travaille bien ensemble — \
mon prénom, ce que je fais, sur quoi je bosse, comment j'aime communiquer. \
Enregistre ce que tu apprends dans ta mémoire."""
prompt_system = """\
Jette un œil au système sur lequel tu tournes. \
Vérifie l'OS, les outils installés, les dossiers de projets, tout ce qui t'intéresse. \
Fais-moi un petit résumé de ce que tu trouves."""
prompt_who = """\
C'est parti ! Présente-toi — qui es-tu, que peux-tu faire pour moi ? \
Puis demande-moi qui je suis et en quoi tu peux m'aider."""

