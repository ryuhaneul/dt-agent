# -- Gemini warning ------------------------------------------------------------

[gemini]
missing_key = """\
Gemini is set to API-key auth mode, but `gemini_api_key` in \
`~/.ductor/config/config.json` is `"null"` or empty.
Why this is required: when DT Agent calls Gemini CLI as an external process, \
Gemini CLI does not expose an internally entered API key to that caller.
Set a real API key in `gemini_api_key` and restart `ductor`."""

