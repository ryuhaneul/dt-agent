# English chat strings (Markdown-formatted, sent to Telegram/Matrix/API).

# -- Session management -------------------------------------------------------

[session]
error_header = "**Session Error**"
error_body = """\
[{model}] An error occurred.
Your session has been preserved -- send another message to retry.
Use /new to start a fresh session if the problem persists."""
error_cause = "**Cause:** {hint}"
error_detail = "**Detail:** `{detail}`"
error_auth = "Authentication failed. In the repository folder on the host, run `./scripts/login.sh <provider>`."
no_auth = "Provider {provider} is not authenticated.\nIn the repository folder on the host, run `./scripts/login.sh {provider}`."
error_rate = "Rate limit reached. Wait a moment and try again."
error_context = "Context length exceeded. Use /new to start a fresh session."

reset_header = "**Session Reset**"
reset_body = """\
Session reset for {provider} in this chat only.
Other provider sessions were preserved.
Send a message to continue."""

age_warning = "[Session is {age} old. Use /new for a fresh start.]"

# #84: Tool-only turns (e.g. silent memory updates) surface this neutral
# status line instead of a blank message the user would never see.
empty_turn = "_(Agent updated memory silently — send another message to continue.)_"

recovered = "_Previous session could not be restored. A new session was started automatically._"
recovery_failed = "Could not recover your session after a fresh start. Please try again or use /new to start over."
sigkill = "Execution was interrupted. Please send the same request again."

not_found = "Session '{name}' not found."
ended = "Session '{name}' has ended. Start a new one with /session."
still_running = "Session '{name}' is still processing. Wait or use /stop to cancel."

