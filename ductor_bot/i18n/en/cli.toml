# English CLI strings (Rich-formatted, shown in terminal).

# -- Status command ------------------------------------------------------------

[status]
path_sessions = "Sessions:   [cyan]{path}[/cyan]"
path_logs = "Logs:       [cyan]{path}[/cyan]"
path_workspace = "Workspace:  [cyan]{path}[/cyan]"
path_config = "Config:     [cyan]{path}[/cyan]"
path_home = "Home:       [cyan]{path}[/cyan]"
title_main = "[bold]Status — main[/bold]"
title = "[bold]Status[/bold]"
running = "[bold green]Running[/bold green]  pid={pid}  uptime: {uptime}"
not_running = "[dim]Not running[/dim]"
provider = "Provider:  [cyan]{provider}[/cyan] ({model})"
errors_found = "Errors:    [bold red]{count}[/bold red] in latest log"
errors_none = "Errors:    [green]0[/green]"
paths_header = "[bold]Paths:[/bold]"
not_configured = "Not configured. Run scripts/onboard.sh on the host, then start the bot."

# -- Config validation ---------------------------------------------------------

[config]
headless_main = "Main agent requires a messenger (headless is sub-agent only)."
not_configured_container = "[bold yellow]Not configured. Run scripts/onboard.sh on the host, then start the bot.[/bold yellow]"
incomplete = "[bold yellow]Config is incomplete. Run [bold]scripts/onboard.sh[/bold].[/bold yellow]"
matrix_no_homeserver = "[bold yellow]Matrix homeserver URL is required.{hint}[/bold yellow]"
matrix_no_user = "[bold yellow]Matrix user_id is required.{hint}[/bold yellow]"
matrix_no_auth = "[bold yellow]Matrix password or access_token is required.{hint}[/bold yellow]"
matrix_no_target = "[bold yellow]At least one allowed_room or allowed_user is required.{hint}[/bold yellow]"
onboarding_hint = " Run [bold]scripts/onboard.sh[/bold] to reconfigure."

# -- Agent management ----------------------------------------------------------

[agents]
inherited = "inherited"
restarts = "[dim](restarts: {count})[/dim]"
title = "[bold]Sub-Agents ({count})[/bold]"
help_remove = "Remove a sub-agent"
help_add = "Add a new sub-agent (interactive)"
help_list = "List all sub-agents and their config"
title_help = "[bold]Agent Commands[/bold]"
col_agent = "Agent"
col_status = "Status"
col_uptime = "Uptime"
col_provider = "Provider"
col_model = "Model"
status_running = "[bold green]running[/bold green]"
status_starting = "[yellow]starting[/yellow]"
status_crashed = "[bold red]crashed[/bold red]"
status_stopped = "[dim]stopped[/dim]"
empty = "[dim]No sub-agents configured.[/dim]"
add_hint = "[dim]Use 'ductor agents add <name>' to create one.[/dim]"

[agents.add]
usage = "[bold red]Usage: ductor agents add <name>[/bold red]"
reserved = "[bold red]Name 'main' is reserved.[/bold red]"
exists = "[bold red]Agent '{name}' already exists.[/bold red]"
prompt_token = "Telegram bot token for '{name}':"
