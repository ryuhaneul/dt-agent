# Strings de CLI em Português (Rich-formatadas, exibidas no terminal).

# -- Comando de status ---------------------------------------------------------

[status]
path_sessions = "Sessões:    [cyan]{path}[/cyan]"
path_logs = "Logs:       [cyan]{path}[/cyan]"
path_workspace = "Workspace:  [cyan]{path}[/cyan]"
path_config = "Config:     [cyan]{path}[/cyan]"
path_home = "Home:       [cyan]{path}[/cyan]"
title_main = "[bold]Status — main[/bold]"
title = "[bold]Status[/bold]"
running = "[bold green]Rodando[/bold green]  pid={pid}  tempo ativo: {uptime}"
not_running = "[dim]Não está rodando[/dim]"
provider = "Provider:  [cyan]{provider}[/cyan] ({model})"
errors_found = "Erros:     [bold red]{count}[/bold red] no último log"
errors_none = "Erros:     [green]0[/green]"
paths_header = "[bold]Caminhos:[/bold]"
not_configured = "Não configurado. Execute scripts/onboard.sh no host e depois inicie o bot."

# -- Validação de config -------------------------------------------------------

[config]
headless_main = "O agente principal precisa de um mensageiro (headless é só para sub-agentes)."
not_configured_container = "[bold yellow]Não configurado. Execute scripts/onboard.sh no host e depois inicie o bot.[/bold yellow]"
incomplete = "[bold yellow]Config está incompleta. Execute [bold]scripts/onboard.sh[/bold].[/bold yellow]"
matrix_no_homeserver = "[bold yellow]URL do homeserver Matrix é obrigatória.{hint}[/bold yellow]"
matrix_no_user = "[bold yellow]user_id do Matrix é obrigatório.{hint}[/bold yellow]"
matrix_no_auth = "[bold yellow]Senha ou access_token do Matrix é obrigatório.{hint}[/bold yellow]"
matrix_no_target = "[bold yellow]Pelo menos um allowed_room ou allowed_user é obrigatório.{hint}[/bold yellow]"
onboarding_hint = " Execute [bold]scripts/onboard.sh[/bold] para reconfigurar."

# -- Ciclo de vida -------------------------------------------------------------

[agents]
inherited = "herdado"
restarts = "[dim](reinícios: {count})[/dim]"
title = "[bold]Sub-agentes ({count})[/bold]"
help_remove = "Remover um sub-agente"
help_add = "Adicionar um novo sub-agente (interativo)"
help_list = "Listar todos os sub-agentes e a configuração deles"
title_help = "[bold]Comandos de agentes[/bold]"
col_agent = "Agente"
col_status = "Status"
col_uptime = "Tempo ativo"
col_provider = "Provider"
col_model = "Modelo"
status_running = "[bold green]rodando[/bold green]"
status_starting = "[yellow]iniciando[/yellow]"
status_crashed = "[bold red]crashou[/bold red]"
status_stopped = "[dim]parado[/dim]"
empty = "[dim]Nenhum sub-agente configurado.[/dim]"
add_hint = "[dim]Use 'ductor agents add <nome>' para criar um.[/dim]"

[agents.add]
usage = "[bold red]Uso: ductor agents add <nome>[/bold red]"
reserved = "[bold red]O nome 'main' é reservado.[/bold red]"
exists = "[bold red]Agente '{name}' já existe.[/bold red]"
prompt_token = "Token do bot Telegram para '{name}':"
prompt_users = "IDs de usuários permitidos (separados por vírgula):"
prompt_groups = "IDs de grupos permitidos (separados por vírgula, deixe vazio para nenhum):"
prompt_provider = "Provider:"
prompt_model = "Modelo (ex.: opus, sonnet, o3):"
cancelled = "[dim]Cancelado.[/dim]"
done = "[green]Agente '{name}' adicionado ao agents.json.[/green]"
auto_start = "[dim]Será iniciado automaticamente na próxima (re)inicialização do bot.[/dim]"

[agents.remove]
usage = "[bold red]Uso: ductor agents remove <nome>[/bold red]"
not_found = "[bold red]Agente '{name}' não encontrado.[/bold red]"
confirm = "Remover agente '{name}'? (Os dados do workspace não serão excluídos.)"
done = "[green]Agente '{name}' removido do agents.json.[/green]"
data_hint = "[dim]Dados do workspace permanecem em {path}[/dim]"

# -- Instalar extras -----------------------------------------------------------

[help]
title_commands = "[bold]Comandos[/bold]"
col_command = "Comando"
col_description = "Descrição"
ductor = "Iniciar o bot configurado"
agents = "Gerenciamento de sub-agentes (list/add/remove)"
status = "Mostrar status do bot, caminhos e agentes"
help = "Mostrar esta mensagem"
verbose = "Saída de log detalhada"
