status_crashed = "[bold red]crash[/bold red]"
status_stopped = "[dim]dihentikan[/dim]"
empty = "[dim]Tidak ada sub-agen yang dikonfigurasi.[/dim]"
add_hint = "[dim]Gunakan 'ductor agents add <nama>' untuk membuat satu.[/dim]"

[agents.add]
usage = "[bold red]Penggunaan: ductor agents add <nama>[/bold red]"
reserved = "[bold red]Nama 'main' sudah dicadangkan.[/bold red]"
exists = "[bold red]Agen '{name}' sudah ada.[/bold red]"
