[agents.remove]
usage = "[bold red]Penggunaan: ductor agents remove <nama>[/bold red]"
not_found = "[bold red]Agen '{name}' tidak ditemukan.[/bold red]"
confirm = "Hapus agen '{name}'? (Data workspace tidak akan dihapus.)"
