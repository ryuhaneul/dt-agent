# Indonesian CLI strings (Rich-formatted, shown in terminal).

# -- Status command ------------------------------------------------------------

[status]
path_sessions = "Sesi:       [cyan]{path}[/cyan]"
path_logs = "Log:        [cyan]{path}[/cyan]"
path_workspace = "Workspace:  [cyan]{path}[/cyan]"
path_config = "Konfig:     [cyan]{path}[/cyan]"
path_home = "Home:       [cyan]{path}[/cyan]"
title_main = "[bold]Status — main[/bold]"
title = "[bold]Status[/bold]"
running = "[bold green]Berjalan[/bold green]  pid={pid}  uptime: {uptime}"
not_running = "[dim]Tidak berjalan[/dim]"
provider = "Provider:  [cyan]{provider}[/cyan] ({model})"
errors_found = "Kesalahan: [bold red]{count}[/bold red] di log terbaru"
errors_none = "Kesalahan: [green]0[/green]"
paths_header = "[bold]Path:[/bold]"
not_configured = "Belum dikonfigurasi. Jalankan scripts/onboard.sh di host, lalu mulai bot."

# -- Config validation ---------------------------------------------------------

[config]
headless_main = "Agen utama memerlukan messenger (headless hanya untuk sub-agen)."
not_configured_container = "[bold yellow]Belum dikonfigurasi. Jalankan scripts/onboard.sh di host, lalu mulai bot.[/bold yellow]"
incomplete = "[bold yellow]Konfigurasi tidak lengkap. Jalankan [bold]scripts/onboard.sh[/bold].[/bold yellow]"
matrix_no_homeserver = "[bold yellow]URL homeserver Matrix diperlukan.{hint}[/bold yellow]"
matrix_no_user = "[bold yellow]user_id Matrix diperlukan.{hint}[/bold yellow]"
matrix_no_auth = "[bold yellow]Kata sandi atau access_token Matrix diperlukan.{hint}[/bold yellow]"
matrix_no_target = "[bold yellow]Setidaknya satu allowed_room atau allowed_user diperlukan.{hint}[/bold yellow]"
onboarding_hint = " Jalankan [bold]scripts/onboard.sh[/bold] untuk mengonfigurasi ulang."

# -- Agent management ----------------------------------------------------------

[agents]
inherited = "diwariskan"
restarts = "[dim](restart: {count})[/dim]"
