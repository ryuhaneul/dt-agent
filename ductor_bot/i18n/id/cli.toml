help_list = "Daftar semua sub-agen dan konfigurasinya"
title_help = "[bold]Perintah agen[/bold]"
col_agent = "Agen"
col_status = "Status"
col_uptime = "Uptime"
col_provider = "Provider"
col_model = "Model"
status_running = "[bold green]berjalan[/bold green]"
