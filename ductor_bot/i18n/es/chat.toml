Echa un vistazo al sistema en el que estás ejecutándote. \
Revisa el SO, herramientas instaladas, carpetas de proyecto, lo que te parezca interesante. \
Dame un resumen rápido de lo que encuentres."""
prompt_who = """\
¡Empecemos! Preséntate — ¿quién eres, qué puedes hacer por mí? \
Luego pregúntame quién soy y en qué necesito ayuda."""

