# Русские строки CLI (Rich-форматирование, вывод в терминале).

# -- Команда status ------------------------------------------------------------

[status]
path_sessions = "Сессии:     [cyan]{path}[/cyan]"
path_logs = "Логи:       [cyan]{path}[/cyan]"
path_workspace = "Workspace:  [cyan]{path}[/cyan]"
path_config = "Конфиг:     [cyan]{path}[/cyan]"
path_home = "Home:       [cyan]{path}[/cyan]"
title_main = "[bold]Статус — main[/bold]"
title = "[bold]Статус[/bold]"
running = "[bold green]Работает[/bold green]  pid={pid}  аптайм: {uptime}"
not_running = "[dim]Не работает[/dim]"
provider = "Провайдер: [cyan]{provider}[/cyan] ({model})"
errors_found = "Ошибки:    [bold red]{count}[/bold red] в последнем логе"
errors_none = "Ошибки:    [green]0[/green]"
paths_header = "[bold]Пути:[/bold]"
not_configured = "Не настроено. Запусти scripts/onboard.sh на хосте, затем запусти бота."

# -- Валидация конфига ---------------------------------------------------------

[config]
headless_main = "Главному агенту нужен мессенджер (headless только для суб-агентов)."
not_configured_container = "[bold yellow]Не настроено. Запусти scripts/onboard.sh на хосте, затем запусти бота.[/bold yellow]"
incomplete = "[bold yellow]Конфиг неполный. Выполни [bold]scripts/onboard.sh[/bold].[/bold yellow]"
matrix_no_homeserver = "[bold yellow]Требуется URL Matrix homeserver.{hint}[/bold yellow]"
matrix_no_user = "[bold yellow]Требуется Matrix user_id.{hint}[/bold yellow]"
matrix_no_auth = "[bold yellow]Требуется пароль или access_token Matrix.{hint}[/bold yellow]"
matrix_no_target = "[bold yellow]Нужен хотя бы один allowed_room или allowed_user.{hint}[/bold yellow]"
onboarding_hint = " Выполни [bold]scripts/onboard.sh[/bold] для перенастройки."

# -- Жизненный цикл -----------------------------------------------------------

[agents]
inherited = "наследуется"
restarts = "[dim](перезапусков: {count})[/dim]"
title = "[bold]Суб-агенты ({count})[/bold]"
help_remove = "Удалить суб-агента"
help_add = "Добавить нового суб-агента (интерактивно)"
help_list = "Показать все суб-агенты и их настройки"
title_help = "[bold]Команды агентов[/bold]"
col_agent = "Агент"
col_status = "Статус"
col_uptime = "Аптайм"
col_provider = "Провайдер"
col_model = "Модель"
status_running = "[bold green]работает[/bold green]"
status_starting = "[yellow]запускается[/yellow]"
status_crashed = "[bold red]упал[/bold red]"
status_stopped = "[dim]остановлен[/dim]"
empty = "[dim]Суб-агенты не настроены.[/dim]"
add_hint = "[dim]Используй 'ductor agents add <имя>' для создания.[/dim]"

[agents.add]
usage = "[bold red]Использование: ductor agents add <имя>[/bold red]"
reserved = "[bold red]Имя 'main' зарезервировано.[/bold red]"
exists = "[bold red]Агент '{name}' уже существует.[/bold red]"
prompt_token = "Telegram-токен бота для '{name}':"
prompt_users = "Разрешённые User ID (через запятую):"
prompt_groups = "Разрешённые Group ID (через запятую, пустое — без групп):"
prompt_provider = "Провайдер:"
prompt_model = "Модель (напр. opus, sonnet, o3):"
cancelled = "[dim]Отменено.[/dim]"
done = "[green]Агент '{name}' добавлен в agents.json.[/green]"
auto_start = "[dim]Будет запущен автоматически при следующем (пере)запуске бота.[/dim]"

[agents.remove]
usage = "[bold red]Использование: ductor agents remove <имя>[/bold red]"
not_found = "[bold red]Агент '{name}' не найден.[/bold red]"
confirm = "Удалить агента '{name}'? (Данные рабочего пространства сохранятся.)"
done = "[green]Агент '{name}' удалён из agents.json.[/green]"
data_hint = "[dim]Данные рабочего пространства остаются в {path}[/dim]"

# -- Установка extras ----------------------------------------------------------

[help]
title_commands = "[bold]Команды[/bold]"
col_command = "Команда"
col_description = "Описание"
ductor = "Запустить настроенного бота"
agents = "Управление суб-агентами (list/add/remove)"
status = "Статус бота, пути и агенты"
help = "Показать это сообщение"
verbose = "Подробный вывод логов"
