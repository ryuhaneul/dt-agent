# Korean chat strings (Markdown-formatted, sent to Telegram/Matrix/API).

# -- Session management -------------------------------------------------------

[session]
error_header = "**세션 오류**"
error_body = """\
[{model}] 오류가 발생했어요.
세션은 보존되었어요 — 재시도하려면 다른 메시지를 보내주세요.
문제가 계속되면 /new로 새 세션을 시작하세요."""
error_cause = "**원인:** {hint}"
error_detail = "**상세:** `{detail}`"
error_auth = "인증에 실패했어요. 호스트의 저장소 폴더에서 다음 명령을 실행하세요: `./scripts/login.sh <provider>`."
no_auth = "{provider} provider가 인증되지 않았어요.\n호스트의 저장소 폴더에서 다음 명령을 실행하세요: `./scripts/login.sh {provider}`."
error_rate = "사용량 한도에 도달했어요. 잠시 후 다시 시도하세요."
error_context = "컨텍스트 길이를 초과했어요. /new로 새 세션을 시작하세요."

reset_header = "**세션 초기화**"
reset_body = """\
이 채팅의 {provider} 세션만 초기화됐어요.
다른 provider 세션은 보존됐어요.
메시지를 보내서 계속하세요."""

age_warning = "[세션이 {age} 경과했어요. 새로 시작하려면 /new를 사용하세요.]"

empty_turn = "_(에이전트가 메모리를 조용히 업데이트했어요 — 다음 메시지를 보내서 계속하세요.)_"

recovered = "_이전 세션을 복원할 수 없었어요. 새 세션이 자동으로 시작됐어요._"
recovery_failed = "새로 시작한 뒤에도 세션을 복원할 수 없었어요. 다시 시도하거나 /new 를 써서 새로 시작해 주세요."
sigkill = "실행이 중단됐어요. 같은 요청을 다시 보내주세요."

not_found = "세션 '{name}'을(를) 찾을 수 없어요."
ended = "세션 '{name}'이(가) 종료됐어요. /session으로 새 세션을 시작하세요."
still_running = "세션 '{name}'은 아직 처리 중이에요. 기다리거나 /stop으로 취소하세요."

# -- Stop/interrupt ------------------------------------------------------------

[stop]
header = "**에이전트 중지됨**"
killed = "{provider}이(가) 종료됐어요."
nothing = "지금 실행 중인 게 없어요."
discarded = "이 토픽에서 대기 중이던 메시지 {count}개를 취소했어요."

[interrupt]
done = "{count}개 프로세스를 중단했어요."
nothing = "활성 프로세스가 없어요."

[abort_all]
done = "모든 에이전트에서 {count}개 프로세스를 중지했어요."
nothing = "어떤 에이전트에서도 활성 프로세스를 찾지 못했어요."

# -- Timeout -------------------------------------------------------------------

[timeout]
error_header = "**시간 초과**"
error_body = """\
[{model}] CLI가 {minutes}분 후에 종료됐어요.
세션은 보존되었어요 — 다른 메시지를 보내면 중단된 지점부터 이어서 진행돼요.
/new로 새 세션을 시작할 수도 있어요."""

result_header = "**시간 초과**"
result_body = """\
에이전트가 {elapsed}초 후 시간 초과됐어요 (제한: {configured}초).
프롬프트를 짧게 하거나 단계를 나눠서 물어보세요."""

warning_minutes = "{mins}분 후 시간 초과"
warning_seconds = "{secs}초 후 시간 초과"
extended = "제한 시간 연장 (+{secs}초, {remaining} 남음)"

generic = "에이전트 응답 시간이 초과됐어요. 다시 시도해주세요."

